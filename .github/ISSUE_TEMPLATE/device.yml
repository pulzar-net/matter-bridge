name: Device or hardware support
description: Ask for support for a device, adapter or firmware, or report what works on yours.
labels: [hardware]
body:
  - type: markdown
    attributes:
      value: |
        Check the [hardware page](https://pulzar-net.github.io/matter-bridge/hardware.html) first. A report that something **works** is just as welcome: it moves hardware from "expected" to "tested".
  - type: dropdown
    id: kind
    attributes:
      label: What kind of report
      options:
        - A device or adapter does not work
        - Please support this device or adapter
        - It works (add it to the tested list)
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Devices
      description: Manufacturer and model of the device, its firmware version, how it connects (Ethernet, Wi-Fi, Thread), and a link to the product.
      placeholder: "Nanoleaf Essentials A19 bulb, Thread"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `matter-bridge --version`.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What the bridge sees
      description: The device's entry from `matter/bridge/devices`, and the bridge's log while commissioning it (`RUST_LOG=debug`).
      render: json
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: What works, what does not, links to the device's documentation or another project's support for it.
