[package]
name = "matter-bridge"
description = "A standalone Matter to MQTT bridge with Home Assistant discovery, on a Rust Matter controller built on rs-matter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["matter", "mqtt", "home-assistant", "controller"]
categories = ["command-line-utilities", "network-programming"]

[features]
default = ["ble"]
# Commissioning over Bluetooth LE.
ble = ["matter-controller/ble"]
## Derive a JSON Schema for the configuration, from which the docs' configuration
## reference is generated (tests/config_reference.rs).
schema = ["dep:schemars"]
## Docs tooling, not API: derive JSON Schemas and AsyncAPI messages for the MQTT
## payloads (src/api.rs), from which the docs' MQTT reference is generated
## (tests/asyncapi.rs). It may change in any release; default builds, release
## binaries and cross builds never turn it on.
unstable-asyncapi-docs = ["dep:schemars", "dep:asyncapi-rust"]

[[bin]]
name = "matter-bridge"
path = "src/main.rs"

[dependencies]
matter-controller.workspace = true
matter-model.workspace = true
lexopt = "0.3"
schemars = { version = "1", optional = true, features = ["preserve_order"] }
asyncapi-rust = { version = "0.5", optional = true }
ureq = { version = "3", default-features = false }
rumqttc = { version = "0.25", default-features = false }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "tracing-log"] }

[dev-dependencies]
matter-controller.workspace = true
rumqttd = { version = "0.20", default-features = false }
tempfile = "3"

[[test]]
name = "config_reference"
required-features = ["schema"]

[[test]]
name = "asyncapi"
required-features = ["unstable-asyncapi-docs"]

[lints]
workspace = true
