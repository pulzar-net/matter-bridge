[package]
name = "matter-host"
description = "A Matter controller on rs-matter: onboarding, commissioning over IP, a fabric with a pluggable CA, multi-admin, the interaction model and a node store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/matter-host"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE"]
keywords = ["matter", "controller", "commissioning", "smart-home"]
categories = ["network-programming"]

[features]
default = ["ble"]
# Commissioning over Bluetooth LE, with bluetooth-bridge's host stack.
ble = ["dep:bluetooth-host"]

[dependencies]
bluetooth-host = { version = "0.2", default-features = false, optional = true }
matter-model.workspace = true
rs-matter.workspace = true
async-io.workspace = true
embassy-time.workspace = true
embassy-time-queue-utils.workspace = true
hex.workspace = true
if-addrs.workspace = true
log.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
# X.509 certificates to Matter TLV (the versions rs-matter's crypto uses).
der = { version = "0.8", features = ["alloc", "oid"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
x509-cert = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "tracing-log"] }
tokio = { workspace = true, features = ["rt-multi-thread", "process", "io-util", "macros", "time"] }

[lints]
workspace = true
