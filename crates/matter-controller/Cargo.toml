[package]
name = "matter-controller"
description = "A Matter controller on rs-matter: onboarding, commissioning over IP, a fabric with a pluggable CA, multi-admin, the interaction model and a node store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["matter", "controller", "commissioning", "smart-home"]
categories = ["network-programming"]

[features]
default = ["ble"]
# Commissioning over Bluetooth LE, with bluetooth-bridge's host stack.
ble = ["dep:bluetooth-host"]

[dependencies]
bluetooth-host = { git = "https://github.com/pulzar-net/bluetooth-bridge", tag = "v0.1.0", default-features = false, optional = true }
matter-model.workspace = true
rs-matter.workspace = true
async-io.workspace = true
embassy-time.workspace = true
embassy-time-queue-utils.workspace = true
hex.workspace = true
if-addrs.workspace = true
log.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
